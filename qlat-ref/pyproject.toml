[build-system]
build-backend = 'mesonpy'
requires = [ 'meson-python', 'wheel', 'meson>=0.64' ]

[project]
name = 'qlat-ref'
dynamic = [ 'version', ]
description = 'Pure-NumPy reference implementations used to cross-check qlat'
readme = 'README.md'
requires-python = '>=3.8'
license = { text = 'GPL-3.0-or-later' }
keywords = [ 'lattice', 'qcd', 'gauge-fixing', 'reference' ]
authors = [ { name = 'Luchang Jin', email = 'ljin.luchang@gmail.com' }, ]
# Runtime dependency: numpy only.  The reference package must stay importable
# without pytest and without qlat (see docs/qlat-ref/qlat_ref_overview.md).
dependencies = [ 'numpy', ]

[project.optional-dependencies]
# The test runner.  This is a *test* extra, never a runtime requirement:
# ``pip install .`` installs numpy alone, and ``pip install '.[test]'`` adds the
# parallel runner.  The suite is still a plain standard-library ``unittest``
# suite, so ``python3 -m unittest discover`` works without this extra.
test = [
  'pytest>=8',
  'pytest-xdist>=3',
]

[tool.pytest.ini_options]
# ``cd qlat-ref && python3 -m pytest`` runs the whole suite on several cores.
testpaths = [ 'tests' ]
# -n auto            one worker per CPU ...
# --maxprocesses=8   ... but never more than 8.  The suite is 13 files, so
#                    beyond ~13 workers the only thing that grows is startup
#                    cost (measured: -n 4/8/13/auto all land at ~14.7 s, so the
#                    cap costs nothing and keeps a 64-core host from spawning
#                    64 interpreters).
# --dist loadfile    every test *file* goes to exactly one worker.  This is the
#                    safety rule, not an optimisation: several modules own
#                    process-global state (test_qlat_parity.py calls
#                    q.begin_with_mpi() / q.end_with_mpi() once per module),
#                    so all tests of a file must run in the same interpreter.
#                    Never switch this to --dist load / loadscope without
#                    re-checking those setUpModule/tearDownModule hooks.
addopts = '-n auto --maxprocesses=8 --dist loadfile'
# xdist is therefore not optional for the default invocation.  Declaring it
# here turns "pytest: error: unrecognized arguments: -n --dist" into the
# actionable "ERROR: Missing required plugins: pytest-xdist"; install it with
# `pip install '.[test]'`.  The value is the *distribution* name: pytest
# resolves this list against installed distributions, not against the
# ``pytest11`` entry-point name (``xdist`` would never match).
required_plugins = [ 'pytest-xdist' ]
# Keep the run independent of any user-level pytest configuration.
norecursedirs = [ '.*', 'build', 'dist', '__pycache__' ]
