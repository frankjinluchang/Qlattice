[build-system]
build-backend = 'mesonpy'
requires = [ 'meson-python', 'wheel', 'meson>=0.64' ]

[project]
name = 'qlat-ref'
dynamic = [ 'version', ]
description = 'Pure-NumPy reference implementations used to cross-check qlat'
readme = 'README.md'
requires-python = '>=3.8'
license = { text = 'GPL-3.0-or-later' }
keywords = [ 'lattice', 'qcd', 'gauge-fixing', 'reference' ]
authors = [ { name = 'Luchang Jin', email = 'ljin.luchang@gmail.com' }, ]
dependencies = [ 'numpy', ]
